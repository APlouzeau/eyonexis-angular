<ul>
  @for (item of sidebarItems; track item.id) {
  <li class="flex items-center gap-2 text-xs w-full cursor-pointer hover:bg-gray-200 px-2 py-2 text-gray-600"><img
      src="icons/dashboard-icon.png" class="w-4 h-4" alt="" /><a [routerLink]="item.link">{{item.name}}</a></li>
  }
</ul>
<ul>
  @for (folder of folders(); track folder.idFolder) {
  <li><app-folders [folder]="folder"></app-folders></li>
  }
</ul>
