<div>
    <app-add-bloc></app-add-bloc>
    @if (noteContent(); as n) {
    <app-edit-note-header class="mx-auto" [note]="n"></app-edit-note-header>
    <hr class="w-3/5 m-auto mt-10 hr-color-gray">
    @for (block of n.blocks; track block) {
    @switch (block.block_type) {
    @case ('Text') {<app-edit-text-bloc [block]="block"></app-edit-text-bloc>}
    @case ('Code') {<app-edit-code-bloc [block]="block"></app-edit-code-bloc>}
    }
    }
    }
</div>
