<li>
  <span class="flex items-center text-xs gap-2 w-full py-2 cursor-pointer hover:bg-gray-200 text-gray-600"
    [style.padding-left.px]="8 + depth * 8" (click)="toggle()">
    <img src="icons/folder-icon-2.webp" class="w-4 h-4" alt="" />
    {{ folder.folderName }}
  </span>

  @if (expanded()) {
  <ul>
    @for (child of folder.children; track child.idFolder) {
    <li><app-folders [folder]="child" [depth]="depth + 1"></app-folders></li>
    }
    @for (note of notes(); track note.id) {
    <li>
      <a [routerLink]="['/note', note.id]"
        class="flex items-center gap-2 w-full py-2 hover:bg-gray-200 text-gray-600 text-xs"
        [style.padding-left.px]="8 + (depth + 1) * 8"><img src="icons/note-icon.jpg" class="w-3 h-3" alt="" />
        {{ note.title }}
      </a>
    </li>
    }
  </ul>
  }
</li>
