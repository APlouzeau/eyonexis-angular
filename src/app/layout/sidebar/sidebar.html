<ul>
  @for (item of sidebarItems; track item.id) {
  <li class="block w-full cursor-pointer hover:bg-gray-200 px-4 py-2 text-gray-600"><a
      [routerLink]="item.link">{{item.name}}</a></li>
  }
</ul>
<ul>
  @for (folder of folderNodes(); track folder.idFolder) {
  <li><app-folders [folder]="folder"></app-folders></li>
  }
</ul>
