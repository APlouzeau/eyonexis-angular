<form class="flex gap-2 my-5">
  <input type="text" placeholder="Nom" class="p-2 border rounded-md" [(ngModel)]="newName" name="newName" />
  <app-button label="Dossier" variant="theme" (click)="createFolder()">Dossier</app-button>
  <app-button label="Note" variant="primary" (click)="createNote()">Note</app-button>
</form>
@for (root of folders(); track root.idFolder) {
<app-folder-list [folder]=" root" [depth]="0" [selectParent]="selectParent.bind(this)"
  [isSelected]="root.idFolder === selectedParent()?.idFolder" [selectedParentId]="selectedParent()?.idFolder ?? null" />
}
